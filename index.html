<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الأستاذة / أسماء صالح مقية | المنصة المتطورة</title>
    <meta name="theme-color" content="#ec4899">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --bg: #fdf2f8;
            --bg2: #faf5ff;
            --surface: rgba(255,255,255,0.82);
            --surface-hover: rgba(255,255,255,0.95);
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --primary: #ec4899;
            --primary-dark: #db2777;
            --primary-light: #fbcfe8;
            --secondary: #a855f7;
            --secondary-dark: #9333ea;
            --accent: #f43f5e;
            --border: rgba(236,72,153,0.15);
            --shadow-sm: 0 1px 3px rgba(190,24,93,0.06);
            --shadow-md: 0 4px 20px rgba(190,24,93,0.1);
            --shadow-lg: 0 12px 40px rgba(190,24,93,0.15);
            --shadow-xl: 0 20px 60px rgba(190,24,93,0.2);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 50px;
            --glass-blur: 16px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --spring: 0.45s cubic-bezier(0.34,1.56,0.64,1);
        }
        .dark {
            --bg: #0f0a14;
            --bg2: #1a1125;
            --surface: rgba(30,18,45,0.85);
            --surface-hover: rgba(40,25,55,0.95);
            --text: #f3e8ff;
            --text-secondary: #c4b5d4;
            --text-tertiary: #8b7a9e;
            --primary: #f472b6;
            --primary-dark: #ec4899;
            --primary-light: #4a1d3a;
            --secondary: #c084fc;
            --secondary-dark: #a855f7;
            --accent: #fb7185;
            --border: rgba(244,114,182,0.2);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Tajawal','Cairo',sans-serif;
            background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 40%, #fff5f7 70%, #fce7f3 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            color: var(--text);
            transition: background 0.5s ease, color 0.3s ease;
            position: relative;
        }
        .dark body, body.dark {
            background: linear-gradient(160deg, #0f0a14 0%, #1a1125 40%, #0d0a18 70%, #12081c 100%);
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s;
        }
        body::before {
            top: -130px;
            left: -90px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(236,72,153,0.12) 0%, transparent 70%);
        }
        body::after {
            bottom: -110px;
            right: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(168,85,247,0.10) 0%, transparent 70%);
        }
        .dark body::before {
            background: radial-gradient(circle, rgba(236,72,153,0.18) 0%, transparent 70%);
        }
        .dark body::after {
            background: radial-gradient(circle, rgba(168,85,247,0.16) 0%, transparent 70%);
        }

        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #fdf2f8, #faf5ff);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s;
            pointer-events: all;
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #splashScreen .splash-icon {
            font-size: 5rem;
            animation: splashBounce 1s ease-in-out infinite;
        }
        #splashScreen .splash-title {
            font-family: 'El Messiri','Cairo',serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #db2777, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 10px;
        }
        @keyframes splashBounce {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-18px) scale(1.08); }
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--surface);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--border);
            padding: 12px 16px 10px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 700px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header .student-name {
            font-family: 'El Messiri','Cairo',serif;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .app-subtitle {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-tertiary);
            display: block;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--spring);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .icon-btn:hover {
            transform: scale(1.1);
            background: var(--primary);
            color: #fff;
        }
        .icon-btn:active {
            transform: scale(0.9);
        }
        .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 9px;
            height: 9px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid #fff;
            display: none;
        }
        .badge-dot.show {
            display: block;
        }

        .search-container {
            max-width: 700px;
            margin: 10px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }
        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--surface);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border);
            padding: 4px 8px 4px 4px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .search-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 12px;
            font-family: 'Tajawal',sans-serif;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            min-width: 0;
        }
        .search-wrapper input::placeholder {
            color: var(--text-tertiary);
        }
        .search-wrapper .search-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .filter-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding: 0 4px;
        }
        .chip {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            transition: var(--spring);
            white-space: nowrap;
        }
        .chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(236,72,153,0.3);
        }
        .chip:hover {
            border-color: var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 12px 14px 110px;
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }
        .section-title {
            font-family: 'Cairo',sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin: 16px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lessons-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .empty-state .empty-icon {
            font-size: 4.5rem;
            display: block;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }
        .empty-state .empty-title {
            font-family: 'Cairo',sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .empty-state .empty-desc {
            font-size: 0.85rem;
            color: var(--text-tertiary);
        }

        .lesson-card {
            background: var(--surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            border: 1.5px solid var(--border);
            transition: var(--spring);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.45s ease-out both;
        }
        .lesson-card.pinned {
            border-color: #fbbf24;
            box-shadow: 0 0 0 2px rgba(251,191,36,0.2);
        }
        .lesson-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .lesson-card:active {
            transform: scale(0.97);
        }
        .lesson-card .card-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .card-icon.cat-0 {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
            color: #db2777;
        }
        .card-icon.cat-1 {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #2563eb;
        }
        .card-icon.cat-2 {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #059669;
        }
        .card-icon.cat-3 {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #d97706;
        }
        .card-icon.cat-4 {
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
            color: #7c3aed;
        }
        .lesson-card .card-info {
            flex: 1;
            min-width: 0;
            z-index: 1;
        }
        .lesson-card .card-title {
            font-family: 'Cairo',sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        .lesson-card .card-meta {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .meta-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .badge-text {
            background: #fce7f3;
            color: #be185d;
        }
        .badge-image {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .badge-pdf {
            background: #ffe4e6;
            color: #be123c;
        }
        .badge-video {
            background: #fee2e2;
            color: #dc2626;
        }
        .card-actions {
            display: flex;
            gap: 4px;
            z-index: 2;
            flex-shrink: 0;
        }
        .card-action-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--spring);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-action-btn:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }
        .card-action-btn.pin-btn.pinned-active {
            color: #f59e0b;
            background: #fef3c7;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0 16px;
        }
        .stat-item {
            flex: 1;
            min-width: 70px;
            background: var(--surface);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 12px 10px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .stat-item .stat-num {
            font-family: 'Readex Pro','Cairo',sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-item .stat-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .fab {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary-dark));
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: var(--shadow-xl);
            transition: var(--spring);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:hover {
            transform: translateX(-50%) scale(1.08);
        }
        .fab:active {
            transform: translateX(-50%) scale(0.9);
        }
        .fab .ripple {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            animation: ripple 2s ease-out infinite;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 80;
            background: var(--surface);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            text-align: center;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.04);
            font-size: 0.7rem;
            color: var(--text-tertiary);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .footer .about-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 24px;
            border-radius: var(--radius-full);
            font-family: 'Cairo',sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--spring);
            letter-spacing: 0.5px;
            background: rgba(236,72,153,0.05);
        }
        .footer .about-btn:hover {
            background: var(--primary);
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(236,72,153,0.3);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            background: var(--surface);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            padding: 8px 18px 28px;
            box-shadow: 0 -8px 50px rgba(0,0,0,0.25);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
            position: relative;
        }
        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }
        .modal-sheet .modal-handle {
            width: 40px;
            height: 5px;
            background: #d1d5db;
            border-radius: 10px;
            margin: 10px auto 14px;
        }
        .modal-sheet .modal-title {
            font-family: 'Cairo',sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            font-family: 'Tajawal',sans-serif;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            outline: none;
            resize: vertical;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(236,72,153,0.06);
        }
        .form-group textarea {
            min-height: 80px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .btn {
            flex: 1;
            padding: 13px;
            border-radius: var(--radius-full);
            border: none;
            font-family: 'Cairo',sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--spring);
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 6px 18px rgba(219,39,119,0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 10px 28px rgba(219,39,119,0.45);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #6b7280;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            display: inline-block;
            width: auto;
            padding: 10px 18px;
            margin: 4px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-weight: 600;
            font-family: 'Cairo',sans-serif;
            transition: var(--spring);
        }
        .btn-outline:hover {
            background: var(--primary-light);
        }

        .view-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 250;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .view-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .view-modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 600px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 20px 18px;
            box-shadow: var(--shadow-xl);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s var(--spring);
            position: relative;
        }
        .view-modal-overlay.active .view-modal {
            transform: scale(1) translateY(0);
        }
        .view-modal .close-view-btn {
            position: sticky;
            top: 0;
            float: left;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 5;
            transition: var(--transition);
        }
        .view-modal .view-title {
            font-family: 'Cairo',sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin: -28px 0 14px 40px;
        }
        .view-content-text {
            font-size: 0.95rem;
            line-height: 2;
            color: var(--text);
            white-space: pre-wrap;
        }
        .view-content-image {
            width: 100%;
            border-radius: var(--radius-md);
            max-height: 350px;
            object-fit: contain;
            background: var(--bg);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin: 10px 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-md);
        }

        /* PDF Viewer Styles */
        .pdf-viewer-container {
            background: #f8f9fa;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
        .pdf-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .pdf-toolbar .page-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pdf-toolbar button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--spring);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pdf-toolbar button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        .pdf-toolbar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pdf-toolbar .page-info {
            font-family: 'Readex Pro', 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            min-width: 90px;
            text-align: center;
        }
        .pdf-canvas-wrapper {
            overflow: auto;
            text-align: center;
            padding: 10px;
            background: #e5e7eb;
            max-height: 60vh;
            display: flex;
            justify-content: center;
        }
        .pdf-canvas-wrapper canvas {
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border-radius: 4px;
            background: white;
        }
        .pdf-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
        }
        .pdf-loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .pdf-actions-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
        }

        .about-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .about-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .about-modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-xl);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s var(--spring);
            position: relative;
        }
        .about-modal-overlay.active .about-modal {
            transform: scale(1) translateY(0);
        }
        .about-modal .designer-name {
            font-family: 'Cairo',sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }
        .about-modal .contact-info {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            direction: ltr;
            font-weight: 600;
        }
        .about-modal .back-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: var(--radius-full);
            font-family: 'Cairo',sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--spring);
            box-shadow: 0 6px 18px rgba(236,72,153,0.3);
        }
        .about-modal .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(236,72,153,0.4);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-130px);
            z-index: 400;
            background: #1f2937;
            color: #fff;
            padding: 10px 22px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: var(--shadow-lg);
            transition: transform 0.4s var(--spring);
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #059669;
        }
        .toast.error {
            background: #dc2626;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
